info:
  name: Website Translations
  type: http
  seq: 3

http:
  method: GET
  url: https://{{host}}/umbraco/delivery/api/v2/translations?locale=en&startitem=app
  headers:
    - name: Api-Key
      value: "{{Api-Key}}"
  params:
    - name: locale
      value: en
      type: query
    - name: startitem
      value: app
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
